# Всё, что нужно поменять под другую нишу, находится в этом файле.
business:
  name: "Шиномонтаж на Ветеранов"
  address: "Санкт-Петербург, пр. Ветеранов, 101"
  phone: "+7 (812) 000-00-00"

timezone: "Europe/Moscow"

# Часы работы по дням недели: 0 = понедельник ... 6 = воскресенье.
# Нет дня в списке = выходной.
working_hours:
  0: ["09:00", "20:00"]
  1: ["09:00", "20:00"]
  2: ["09:00", "20:00"]
  3: ["09:00", "20:00"]
  4: ["09:00", "20:00"]
  5: ["10:00", "18:00"]
  6: ["10:00", "18:00"]

# Шаг сетки времени (минуты) и напоминание клиенту (часы до записи)
slot_step_minutes: 30
reminder_hours_before: 2
# Через сколько часов после визита попросить оценку
review_hours_after: 1
booking_days_ahead: 7

services:
  - id: tyres_r13_16
    name: "Переобувка R13–R16"
    duration_minutes: 60
    price: 2400
  - id: tyres_r17_19
    name: "Переобувка R17–R19"
    duration_minutes: 90
    price: 3200
  - id: balancing
    name: "Балансировка"
    duration_minutes: 30
    price: 200
  - id: storage
    name: "Хранение шин"
    duration_minutes: 30
    price: 1500

# Тексты, которые зависят от ниши
texts:
  comment_prompt: "Напишите марку авто и размер шин (например: Kia Rio, 185/65 R15). Это поможет подготовиться."
  comment_icon: "🚗"
