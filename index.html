<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шиномонтаж</title>
  <meta name="description" content="Шиномонтаж: запись онлайн через Telegram, прозрачные цены.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <span class="logo" id="logo"></span>
      <a class="btn" data-cta href="#"></a>
    </div>
    <div class="hero">
      <div class="wrap">
        <h1 id="hero-title"></h1>
        <p id="hero-text"></p>
        <a class="btn" data-cta href="#"></a>
      </div>
    </div>
  </header>

  <main>
    <section id="services"><div class="wrap"><h2 id="services-title"></h2><ul class="price-list" id="services-list"></ul></div></section>
    <section id="why"><div class="wrap"><h2 id="why-title"></h2><div class="grid3" id="why-list"></div></div></section>
    <section id="works"><div class="wrap"><h2 id="works-title"></h2><div class="works" id="works-list"></div></div></section>
    <section id="reviews"><div class="wrap"><h2 id="reviews-title"></h2><div class="grid3" id="reviews-list"></div><p class="note" id="reviews-note"></p></div></section>
    <section id="contacts">
      <div class="wrap">
        <h2 id="contacts-title"></h2>
        <div class="contacts">
          <ul id="contacts-list"></ul>
          <iframe id="map" title="Карта" loading="lazy"></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>
  <a class="btn fab" data-cta href="#"></a>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
