<title>Шиномонтаж на Ветеранов</title>
<style>
/* Цвета и размеры — меняйте здесь под новую нишу */
:root {
  --accent: #ff6b1a;
  --accent-dark: #d94f00;
  --dark: #15181d;
  --bg: #ffffff;
  --bg-alt: #f4f5f7;
  --text: #1f2430;
  --muted: #6a7280;
  --radius: 14px;
  --max: 1080px;
  --card: #ffffff;
  --shadow: var(--shadow);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101318; --bg-alt:#171b22; --card:#1e232c; --text:#e8eaef; --muted:#9aa3b2; --accent-dark:#ff8a45; --shadow:rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] { --bg:#101318; --bg-alt:#171b22; --card:#1e232c; --text:#e8eaef; --muted:#9aa3b2; --accent-dark:#ff8a45; --shadow:rgba(0,0,0,.4); color-scheme: dark }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); line-height: 1.5; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }
section { padding: 56px 0; }
section:nth-of-type(even) { background: var(--bg-alt); }
h2 { font-size: clamp(1.5rem, 4vw, 2rem); margin-bottom: 28px; }

.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 14px 26px; border-radius: 999px; transition: background .2s, transform .1s; }
.btn:hover { background: var(--accent-dark); }
.btn:active { transform: scale(.97); }

header.top { background: var(--dark); color: #fff; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
.logo { font-weight: 800; font-size: 1.1rem; }
.hero { padding: 64px 0 80px; text-align: center; background: radial-gradient(circle at 70% 0, #2b323d, var(--dark) 60%); color: #fff; }
.hero h1 { font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.1; margin-bottom: 16px; }
.hero p { max-width: 560px; margin: 0 auto 28px; color: #c9ced8; font-size: 1.1rem; }

.price-list { list-style: none; padding: 0; display: grid; gap: 12px; }
.price-list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--card); padding: 18px 20px; border-radius: var(--radius); box-shadow: 0 1px 3px var(--shadow); }
.price-list small { display: block; color: var(--muted); }
.price { font-weight: 800; color: var(--accent-dark); white-space: nowrap; }

.grid3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.card { background: var(--card); padding: 24px; border-radius: var(--radius); box-shadow: 0 1px 3px var(--shadow); }
.card .icon { font-size: 2rem; }
.card h3 { margin: 8px 0; }
.card p { color: var(--muted); }

.works { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.work { aspect-ratio: 4 / 3; border-radius: var(--radius); display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(135deg, #3a4250, var(--accent)); text-align: center; padding: 8px; }
.work img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius); }

.stars { color: #f5b301; letter-spacing: 2px; }
.note { color: var(--muted); font-size: .9rem; margin-top: 16px; }

.contacts { display: grid; gap: 24px; grid-template-columns: 1fr; }
.contacts ul { list-style: none; padding: 0; display: grid; gap: 10px; }
.contacts a { color: var(--accent-dark); }
iframe { width: 100%; height: 320px; border: 0; border-radius: var(--radius); }
@media (min-width: 760px) { .contacts { grid-template-columns: 1fr 1.4fr; } }

footer { background: var(--dark); color: #aab0bb; text-align: center; padding: 28px 16px; font-size: .9rem; }
.fab { position: fixed; right: 16px; bottom: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.3); z-index: 5; }
@media (min-width: 760px) { .fab { display: none; } }

.mapcard { display:grid; place-items:center; gap:12px; min-height:240px; border-radius:var(--radius); padding:24px; text-align:center; color:#fff;
  background: repeating-linear-gradient(45deg, #2b323d 0 18px, #313948 18px 36px); }
.mapcard .pin { font-size:2.4rem; }
.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

</style>

  <header class="top">
    <div class="wrap nav">
      <span class="logo" id="logo"></span>
      <a class="btn" data-cta href="#"></a>
    </div>
    <div class="hero">
      <div class="wrap">
        <h1 id="hero-title"></h1>
        <p id="hero-text"></p>
        <a class="btn" data-cta href="#"></a>
      </div>
    </div>
  </header>

  <main>
    <section id="services"><div class="wrap"><h2 id="services-title"></h2><ul class="price-list" id="services-list"></ul></div></section>
    <section id="why"><div class="wrap"><h2 id="why-title"></h2><div class="grid3" id="why-list"></div></div></section>
    <section id="works"><div class="wrap"><h2 id="works-title"></h2><div class="works" id="works-list"></div></div></section>
    <section id="reviews"><div class="wrap"><h2 id="reviews-title"></h2><div class="grid3" id="reviews-list"></div><p class="note" id="reviews-note"></p></div></section>
    <section id="contacts">
      <div class="wrap">
        <h2 id="contacts-title"></h2>
        <div class="contacts">
          <ul id="contacts-list"></ul>
          <div class="mapcard"><div class="pin">📍</div><div id="map-addr"></div><a class="btn" id="map" target="_blank" rel="noopener">Открыть на Яндекс.Картах</a></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>
  <a class="btn fab" data-cta href="#"></a>

  
<script>
// ВСЕ тексты, цены и ссылки сайта — здесь. Под новую нишу меняйте только этот объект (и цвета в css/style.css).
const SITE = {
  name: "Шиномонтаж на Ветеранов",
  tagline: "Переобуем быстро, без очередей и скрытых доплат. Запись онлайн за минуту.",
  botLink: "https://t.me/ИМЯ_БОТА", // замените на ссылку вашего бота
  ctaText: "Записаться",

  servicesTitle: "Услуги и цены",
  services: [
    { name: "Переобувка R13–R16", duration: "60 мин", price: "2 400 ₽" },
    { name: "Переобувка R17–R19", duration: "90 мин", price: "3 200 ₽" },
    { name: "Балансировка", duration: "30 мин", price: "от 200 ₽ / колесо" },
    { name: "Хранение шин", duration: "сезон", price: "1 500 ₽" },
  ],

  whyTitle: "Почему мы",
  why: [
    { icon: "⚡", title: "Быстро", text: "Комплект колёс — за час. Записываетесь на время и не стоите в очереди." },
    { icon: "💰", title: "Честные цены", text: "Цена из прайса — цена на кассе. Без скрытых доплат." },
    { icon: "🛡️", title: "Гарантия", text: "Гарантия на работы, аккуратное обращение с дисками." },
  ],

  worksTitle: "Наши работы",
  works: ["Работа 1", "Работа 2", "Работа 3", "Работа 4", "Работа 5", "Работа 6"], // подписи заглушек; замените на пути к фото

  reviewsTitle: "Отзывы",
  reviewsNote: "Демо-отзывы: выдуманы для шаблона",
  reviews: [
    { name: "Алексей", text: "Приехал по записи, переобули за 50 минут. Всё чисто и аккуратно.", stars: 5 },
    { name: "Марина", text: "Удобно, что можно записаться в Telegram. Напомнили заранее.", stars: 5 },
    { name: "Игорь", text: "Балансировка недорого, машина больше не бьёт на скорости.", stars: 4 },
  ],

  contactsTitle: "Как нас найти",
  address: "Санкт-Петербург, пр. Ветеранов, 101",
  phone: "+7 (812) 000-00-00",
  hours: "Пн–Пт 9:00–20:00, Сб–Вс 10:00–18:00",
  // координаты для карты (OpenStreetMap), проверьте их для своего адреса
  map: { lat: 59.8420, lon: 30.1850 },

  footer: "Демо-сайт для портфолио",
};

// Рендерит страницу из объекта SITE (js/config.js). Здесь менять ничего не нужно.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

document.title = SITE.name;
$("logo").textContent = SITE.name;
$("hero-title").textContent = SITE.name;
$("hero-text").textContent = SITE.tagline;
document.querySelectorAll("[data-cta]").forEach((a) => { a.href = SITE.botLink; a.textContent = SITE.ctaText; });

$("services-title").textContent = SITE.servicesTitle;
$("services-list").innerHTML = SITE.services
  .map((s) => `<li><div>${esc(s.name)}<small>${esc(s.duration)}</small></div><span class="price">${esc(s.price)}</span></li>`)
  .join("");

$("why-title").textContent = SITE.whyTitle;
$("why-list").innerHTML = SITE.why
  .map((w) => `<div class="card"><div class="icon">${esc(w.icon)}</div><h3>${esc(w.title)}</h3><p>${esc(w.text)}</p></div>`)
  .join("");

$("works-title").textContent = SITE.worksTitle;
// если в works указан путь к картинке (.jpg/.png/.webp), показываем фото, иначе заглушку с подписью
$("works-list").innerHTML = SITE.works
  .map((w) => (/\.(jpe?g|png|webp)$/i.test(w) ? `<div class="work"><img src="${esc(w)}" alt="Наша работа" loading="lazy"></div>` : `<div class="work">${esc(w)}</div>`))
  .join("");

$("reviews-title").textContent = SITE.reviewsTitle;
$("reviews-list").innerHTML = SITE.reviews
  .map((r) => `<div class="card"><div class="stars">${"★".repeat(r.stars)}${"☆".repeat(5 - r.stars)}</div><p>«${esc(r.text)}»</p><strong>${esc(r.name)}</strong></div>`)
  .join("");
$("reviews-note").textContent = SITE.reviewsNote;

$("contacts-title").textContent = SITE.contactsTitle;
const tel = SITE.phone.replace(/[^\d+]/g, "");
$("contacts-list").innerHTML =
  `<li>📍 ${esc(SITE.address)}</li><li>📞 <a href="tel:${esc(tel)}">${esc(SITE.phone)}</a></li><li>🕒 ${esc(SITE.hours)}</li>`;
$("map-addr").textContent = SITE.address;
$("map").href = "https://yandex.ru/maps/?text=" + encodeURIComponent(SITE.address);
$("footer").textContent = `© ${new Date().getFullYear()} ${SITE.name} · ${SITE.footer}`;

</script>
